syntax = "proto3";

package proto.sso.rpc;
option go_package = "github.com/Unpakenman/protos/gen/go/sso/rpc";

message AddAppointmentRequest{
  //clinic_id
  int64 clinic_id = 1;
  //patient_id
  int64 patient_id = 2;
  //employee_id
  int64 employee_id = 3;
  //start_at
  string start_at = 4;
  //end_at
  string end_at = 5;
  //comment
  string comment = 6;
}
message AddAppointmentResponse{
  int64 appointment_id= 1;
}
